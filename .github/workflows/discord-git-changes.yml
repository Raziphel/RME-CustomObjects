name: Discord Git Changes

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post pushed commits
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_GIT_CHANGES_WEBHOOK }}
        run: |
          test -n "$WEBHOOK_URL"
          jq -r '
            .commits[:12][] |
            "- [`\(.id[0:7])`](\(.url)) \((.message | split("\n")[0] | if length > 120 then .[0:117] + "..." else . end)) — \(.author.name)"
          ' "$GITHUB_EVENT_PATH" > /tmp/commits.txt
          {
            printf '**%s** — `%s` pushed to `%s`\n' "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:7}" "${GITHUB_REF_NAME}"
            cat /tmp/commits.txt
          } > /tmp/message.txt
          jq -n --rawfile content /tmp/message.txt '{content: $content, allowed_mentions: {parse: []}}' \
            | curl --fail-with-body --silent --show-error -X POST "$WEBHOOK_URL?wait=true" \
                -H 'Content-Type: application/json' --data-binary @-
